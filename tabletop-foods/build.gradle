plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = '1.0.0+mc26.2'
group = 'dev.tabletopfoods'
base.archivesName = 'tabletop-foods'

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.2'
    // Optional local companion for development; not bundled in the published JAR.
    if (file('../speed-apple/dist/adventure-snacks-1.1.0+mc26.2.jar').exists()) {
        runtimeOnly files('../speed-apple/dist/adventure-snacks-1.1.0+mc26.2.jar')
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

sourceSets {
    modelChecks {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    devtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('verifyFoodModels', JavaExec) {
    dependsOn tasks.named('modelChecksClasses'), tasks.named('processResources')
    classpath = sourceSets.modelChecks.runtimeClasspath
    mainClass = 'dev.tabletopfoods.checks.ModelChecks'
    args file('src/main/resources').absolutePath
}
tasks.named('check') { dependsOn tasks.named('verifyFoodModels') }
tasks.named('runClient') { dependsOn tasks.named('devtestClasses') }

loom {
    mods {
        tabletopfoods { sourceSet sourceSets.main }
        tabletopfoods_devtests { sourceSet sourceSets.devtest }
    }
    runs {
        client {
            source sourceSets.devtest
            programArg '--width'
            programArg '1060'
            programArg '--height'
            programArg '720'
            vmArg '-Xmx2G'
        }
    }
}
